<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N.E.K.O WebUI</title>
  <link rel="stylesheet" href="floating-frame.css">
</head>
<body>
  <iframe
    id="webui"
    name="neko-floating-frame"
    title="N.E.K.O WebUI"
    allowtransparency="true"
    allow="autoplay *; microphone *; camera *; display-capture *; clipboard-read *; clipboard-write *; local-network-access *"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script src="floating-frame.js"></script>
</body>
</html>
